[project]
name = "wayback-gap-detector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "surt==0.3.1",
    "tqdm>=4.65.0",
    "urllib3>=1.26.8",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
